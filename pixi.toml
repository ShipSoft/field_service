[workspace]
name = "field_service"
description = "SHiP magnetic field service (framework-agnostic, covfie-backed)"
channels = ["https://prefix.dev/ship", "conda-forge"]
platforms = ["linux-64"]
[dependencies]
# Required by CovfieFieldSource (find_package mp-units CONFIG REQUIRED).
mp-units = "*"

# Canonical ShipSoft unit vocabulary (SHiP::SHiPUnits, headers-only). Needs
# the first shipdatamodel release that ships SHiP/Units.hpp.
shipdatamodel = "*"

# Required by the default BUILD_G4_ADAPTER=ON path.
geant4 = ">=11.3"

# Geant4Config.cmake does find_dependency(EXPAT 2.8.1), which needs the headers
# and the libexpat.so dev symlink from the `expat` package. geant4's qt_* builds
# only depend on `libexpat` (the runtime .so.1), so declare it explicitly --
# otherwise CMake falls back to the system expat and configure fails. Drop this
# once conda-forge/geant4-feedstock restores the `expat` dependency.
expat = "*"

# Required by tools/fairship_to_cvf (only built when ROOT is detected).
root = ">=6.36"

# Build toolchain.
cmake = ">=3.28"
ninja = "*"
cxx-compiler = "*"

# covfie + Catch2 are fetched at configure time via FetchContent.
git = "*"

# Static analysis. clang-tidy lives here rather than in [feature.lint] because
# it replays the commands in compile_commands.json and so needs the same
# headers the compiler saw; feature.lint is a separate solve group and could
# drift from them. clang-tools provides clang-tidy but does not depend on the
# clang package that ships clang's own builtin headers (stddef.h and friends),
# and without those every translation unit fails to parse.
clang = "*"
clang-tools = "*"

[activation]
scripts = ["activate.sh"]

[tasks]
# CMAKE_CXX_SCAN_FOR_MODULES is off because nothing here is a module and CMake
# turns scanning on by default at C++20. With it on, compile_commands.json
# carries GCC-only flags (-fmodules-ts, -fdeps-format, -fmodule-mapper) that
# clang-tidy rejects outright when it replays the commands.
configure = { cmd = """
cmake -S . -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=RelWithDebInfo \
    -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
    -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
""" }
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
clean = "rm -rf build"

# Build this checkout as conda packages (core/g4/tools split) into a local
# file:// channel that downstream dev environments (e.g. aegir) can resolve
# ahead of prefix.dev/ship. Driven by recipe/recipe.yaml, a dev twin of
# ship-conda-recipes/recipes/field-service — keep the two in lockstep.
# A pixi-build [package] section would be preferable (source dependencies),
# but the pixi-build-rattler-build backend does not yet forward the workspace
# channels to the recipe's build/host resolution, and the multi-output split
# rules out the cmake backend; see the pixi-build gap log in the Documentation
# repo (dev-guide/pixi-build-gaps).

# Static analysis, mirroring ShipSoft/.github's clang-tidy.yml. `clang-tidy`
# reports the whole tree; `clang-tidy-diff` reports only what CI gates on,
# namely findings on lines you changed relative to main. -source-filter is a
# Python regex (run-clang-tidy is a Python script), unlike the llvm::Regex
# patterns in .clang-tidy. These use TOML literal strings so the backslashes
# survive.
clang-tidy = { cmd = '''
run-clang-tidy -p build -j $(nproc) -quiet \
    -source-filter '^(?!.*(/G__|Dict[.]cxx|/_deps/|/CMakeFiles/)).*' \
    -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }
# clang-tidy-diff.py ships with clang-tools but is not on PATH.
clang-tidy-diff = { cmd = '''
git diff --unified=0 --diff-filter=d origin/main HEAD -- '*.cpp' '*.hpp' '*.cxx' '*.h' \
  | python $CONDA_PREFIX/share/clang/clang-tidy-diff.py -p1 -path build -j $(nproc) \
      -quiet -only-check-in-db -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }

[feature.package.dependencies]
rattler-build = ">=0.35"

[feature.package.tasks]
build-local-channel = "rattler-build build --recipe recipe/recipe.yaml --output-dir ../ship-local-channel --channel https://prefix.dev/ship --channel conda-forge"

# Linting / formatting toolchain. prek orchestrates the hooks; the tools come
# from this environment so versions are tracked in pixi.lock and run identically
# everywhere (including NixOS). See .pre-commit-config.yaml.
[feature.lint.dependencies]
prek = "*"
python = ">=3.11"
clang-format = "23.*"
codespell = "*"
reuse = "*"
cffconvert = "*"
commitizen = "*"

# Pinned via PyPI: conda-forge's gersemi lags the version the other SHiP
# repos standardised on, and reflows CMake differently.
[feature.lint.pypi-dependencies]
gersemi = "==0.29.1"

[feature.lint.tasks]
lint = "prek run --all-files"
# Install the git hooks and route them through `pixi run` so the conda-provided
# hook tools are on PATH at commit time (required on NixOS, where the tools are
# not runnable without pixi activation).
install-hooks = '''
prek install --hook-type pre-commit --hook-type commit-msg
hooks=$(git rev-parse --git-path hooks)
for h in pre-commit commit-msg; do
  sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/$h"
done
'''

[environments]
default = { solve-group = "default" }
lint = { features = ["lint"], solve-group = "lint" }
package = { features = ["package"], solve-group = "package" }
